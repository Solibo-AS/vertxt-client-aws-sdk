name: Build

# Pull requests build on the publish workflows' runner and JDK. The unit tests run too: they need
# no AWS, and the LocalStack integration specs only run with -Dtests.integration=localstack. This
# repository is public, so it cannot call the organization's internal shared workflows.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Gradle
        env:
          CI: true
        run: ./gradlew build
